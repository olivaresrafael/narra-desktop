[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/olivaresrafael/narra-desktop"
rust-version = "1.95"

[workspace.dependencies]
# Serializable agent contracts (Spike F: explicit, machine-readable task
# input/events/output). serde is the Rust de-facto standard, MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous HTTP for the OpenAI-compatible model adapter: no async runtime
# imposed on a blocking, cancellation-token-driven core (MIT/Apache-2.0).
ureq = { version = "3", features = ["json"] }
# Line diff for reviewable edit proposals (M4 slice 2b): pure Rust, MIT/
# Apache-2.0, maintained; the standard diff engine in the Rust ecosystem.
similar = "2"
# Content hashing to detect stale proposal bases (M4 slice 2b): MIT/Apache-2.0,
# RustCrypto standard. Needed because `std`'s hasher makes no stability
# guarantee across releases and proposals persist on disk.
sha2 = "0.10"
