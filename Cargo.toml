[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/olivaresrafael/narra-desktop"
rust-version = "1.95"

[workspace.dependencies]
# Serializable agent contracts (Spike F: explicit, machine-readable task
# input/events/output). serde is the Rust de-facto standard, MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous HTTP for the OpenAI-compatible model adapter: no async runtime
# imposed on a blocking, cancellation-token-driven core (MIT/Apache-2.0).
ureq = { version = "3", features = ["json"] }
