[package]
name = "narra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Narra desktop application: writing and agent workspaces (M6)"
publish = false

# Editing framework (D-003, selected from Spike A). License: Apache-2.0,
# verified compatible with GPL-3.0 (D-015). Candidate status: not approved
# for the product until the spike report records a verdict in
# PERFORMANCE_BASELINES.md.
[dependencies]
gpui = "0.2"
# Application core (M6 slice 1): the shell opens and saves documents through
# the boundary-checked project IO instead of raw `fs` calls. Same workspace,
# GPL-3.0, no new supply-chain surface.
narra-core = { path = "../narra-core" }
# Grapheme-correct cursor movement (Spike B requirement). MIT/Apache-2.0, and
# already present in the GPUI dependency tree, so no new supply-chain surface.
unicode-segmentation = "1"
# JSON payloads in the agent panel tests (M6 slice 3). Already in the
# dependency tree through narra-core, so no new supply-chain surface;
# serde (MIT/Apache-2.0) is license-compatible with GPL-3.0 (D-015).
serde_json = "1"
# Unified/side-by-side diff engine (Spike A slice 3, M1-3b). A hand-rolled
# Myers would be a correctness risk for the one surface whose whole job is
# reviewing AI-authored changes (M4 proposals); a wrong diff is a safety bug,
# not a cosmetic one. License: Apache-2.0 (verified compatible with GPL-3.0,
# D-015). Maintenance: Armin Ronacher (mitsuhiko), 227M downloads, latest
# 3.2.0 (2026-08). Candidate status: not approved for the product until the
# spike report records a verdict in PERFORMANCE_BASELINES.md.
similar = "3.2"
