[package]
name = "narra-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UI-neutral application and agent core for the writing environment"
publish = false

[dependencies]
# YAML parser: serde_yaml is deprecated upstream (0.9.34+deprecated); saphyr is
# its actively maintained successor line (MIT/Apache-2.0). The manifest is small
# and parsed manually for strict rejection semantics (no serde layer needed).
saphyr = "0.2"
# Serializable agent contracts (Spike F: explicit input, UI-neutral events,
# machine-readable output). Workspace-pinned; MIT/Apache-2.0.
serde.workspace = true
serde_json.workspace = true
# Synchronous HTTP for the OpenAI-compatible provider adapter: no async
# runtime imposed on a blocking, cancellation-token core (MIT/Apache-2.0).
ureq.workspace = true
# Line diff for reviewable edit proposals (M4 slice 2b, MIT/Apache-2.0).
similar.workspace = true
# Content hashing for stale proposal detection (M4 slice 2b, MIT/Apache-2.0):
# proposals persist on disk, so the hash must be stable across releases.
sha2.workspace = true
# OS secret storage for provider tokens (M5 slice 2, D-022, MIT/Apache-2.0).
keyring.workspace = true
# Screenplay PDF export (M7, Spike G-2; D-025): see the workspace note.
pdf-writer.workspace = true
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
